name: Release Go modules

# Go modules are published by pushing git tags, so this workflow commits the libraries into
# native/bin, tags v<version> and native/v<version>, pushes, and creates the GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v, for example 1.1.1
        required: true
      dry-run:
        description: Smoke-test only; do not commit, tag, or push
        type: boolean
        default: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version $VERSION"; exit 1; }
      - run: bash scripts/fetch-natives.sh natives
      - uses: actions/upload-artifact@v4
        with:
          name: natives
          path: natives
          if-no-files-found: error

  smoke-test:
    needs: fetch
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: natives
          path: natives
      - run: bash scripts/stage-natives.sh
      - name: Load the embedded library from a folder without one
        run: |
          go build -C scripts/smoke-test -o "$RUNNER_TEMP/smoke/smoke-test" .
          cd "$RUNNER_TEMP/smoke" && ./smoke-test

  release:
    needs: smoke-test
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: go-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: natives
          path: natives
      - name: Commit, tag, push, and warm the module proxy
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/release.sh "$VERSION" --skip-fetch
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
